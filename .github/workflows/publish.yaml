name: Publish the MirrorHash package

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false  # never use caching in release builds

      - name: Check npm version
        run: |
          npm_version="$(npm --version)"
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"
          if (( npm_major < 11 || (npm_major == 11 && npm_minor < 15) )); then
            echo "Staged publishing requires npm 11.15.0 or later; found ${npm_version}"
            exit 1
          fi
          echo "Using npm ${npm_version}"
        shell: bash

      - name: Set new version
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_ID must be set to a major.minor value, such as 1.2"
            exit 1
          fi
          git config --global user.email "${{ secrets.USER_MAIL }}"
          git config --global user.name "${{ secrets.USER_NAME }}"
          npm version "${RELEASE_ID}.${GITHUB_RUN_ID}"
        shell: bash
        env:
          RELEASE_ID: ${{ vars.RELEASE_ID }}

      - name: Publish the package
        run: npm stage publish
        shell: bash